name: React CI/CD to EC2 (No Cache)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build

      # Upload the CONTENTS of dist/ to EC2
      - name: Upload Build Files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 👇 send contents, not folder
          source: "dist/*"
          target: "/home/ubuntu/reactapp/dist-contents"
          overwrite: true

      # SSH into EC2 and deploy to Nginx web root
      - name: Deploy to Nginx Web Root
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🧹 Cleaning old files..."
            sudo rm -rf /var/www/html/*

            echo "📦 Copying new build..."
            # copy the *contents* of dist-contents/ into html/
            sudo cp -r /home/ubuntu/reactapp/dist-contents/* /var/www/html/

            echo "🔐 Setting permissions..."
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html

            echo "🚀 Restarting Nginx..."
            sudo systemctl restart nginx

            echo "✅ Deployment successful!"
