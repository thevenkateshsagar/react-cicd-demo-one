name: React CI/CD to EC2 (No Cache)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build

      # Upload build files to EC2 (ubuntu home directory)
      - name: Upload Build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ubuntu/reactapp"

      # SSH into EC2 and deploy to Nginx web root with sudo
      - name: Configure Nginx and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clean the existing HTML directory
            sudo rm -rf /var/www/html/*
            # Copy new build files from upload directory
            sudo cp -r /home/ubuntu/reactapp/* /var/www/html/
            # Fix permissions
            sudo chmod -R 755 /var/www/html
            sudo chown -R www-data:www-data /var/www/html
            # Restart Nginx
            sudo systemctl restart nginx
